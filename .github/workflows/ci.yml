name: CI

on:
  push:
  pull_request:

env:
  XS_CHECK_VERSION: v0.2.30

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fetch xs-check
        run: |
          mkdir -p tools/bin
          curl -sSfL -o tools/bin/xs-check \
            "https://github.com/Divy1211/xs-check/releases/download/${XS_CHECK_VERSION}/xs-check"
          chmod +x tools/bin/xs-check
      - name: Lint XS
        run: python -m hinterland lint
      - name: Tests
        # Data-mod tests skip: the vanilla .dat is copyrighted and not in CI.
        run: python -m pytest -q
      - name: Build (XS + RMS only) and package
        run: |
          python -m hinterland build --no-dat
          python -m hinterland package
